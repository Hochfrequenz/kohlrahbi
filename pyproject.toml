# Build system information and other project-specific configuration below.

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
dependencies = [
  "typer[all]>=0.15.0",
  "edi_energy_scraper>=2.0.0",
  "efoli>=2.2.0",
  "more_itertools>=10.5.0",
  "openpyxl>=3.1.5",
  "pandas>=3.0.2",
  "pydantic>=2.9.2",
  "python-docx>=1.1.2",
  "pytz>=2024.2",
  "tomlkit>=0.13.2",
  "xlsxwriter>=3.2.0",
  "httpx==0.28.1",
  "pdfplumber==0.11.10",
  "beautifulsoup4==4.15.0",
]

name = "kohlrahbi"
description = "Tool to generate machine readable files from AHB documents"
license = { text = "GPL" }
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Kevin Krechan", email = "kevin.krechan@hochfrequenz.de" }]
keywords = ["automation", "ahb", "bdew", "edi@energy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]

[project.scripts]
kohlrahbi = "kohlrahbi:cli"

[project.optional-dependencies]
sqlmodels = ["sqlmodel>=0.0.22", "sqlalchemy[mypy]>=2.0.37"]

[dependency-groups]
test = [
  "coverage==7.15.2",
  "pytest-cov==7.1.0",
  "dictdiffer==0.10.0",
  "freezegun==1.5.5",
  "pytest-datafiles==3.0.1",
  "pytest==9.1.1",
  "syrupy==5.5.3",
  "sqlmodel>=0.0.22",
  "sqlalchemy[mypy]>=2.0.37",
]
lint = ["ruff==0.16.0"]
typecheck = [
  "mypy==2.3.0",
  "networkx-stubs==0.0.1",
  "pandas-stubs==3.0.5.260730",
  "pytest==9.1.1",
  "types-freezegun==1.1.10",
  "types-requests==2.33.0.20260712",
  "sqlmodel>=0.0.22",
  "sqlalchemy[mypy]>=2.0.37",
]
spelling = ["codespell==2.4.3"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "spelling" },
]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/kohlrahbi/releases"
Homepage = "https://github.com/Hochfrequenz/kohlrahbi"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kohlrahbi/version.py"

[tool.hatch.build.targets.sdist]
exclude = ["/unittests", "/edi_energy_mirror"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["edi_energy_mirror", "src/kohlrahbi/version.py"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "N",   # pep8-naming
  "PL",  # pylint
  "RUF", # ruff-specific rules
]
ignore = [
  "PLR0913", # too-many-arguments - not enforced under the old pylint config either
  "PLR0917", # too-many-positional-arguments
  "PLR0912", # too-many-branches
  "PLR0915", # too-many-statements
  "PLR2004", # magic-value-comparison
  "RUF001",  # ambiguous-unicode-character-string - false positives on German quotation marks („"›)
]

[tool.ruff.lint.per-file-ignores]
"unittests/**" = ["PLR2004"]
# lazy imports for CLI startup performance, same convention as the removed
# `# pylint: disable=import-outside-toplevel` file headers
"src/kohlrahbi/*/command.py" = ["PLC0415"]
# long lines are unavoidable German legal text / docx filename regex patterns,
# same convention as the removed `# pylint: disable=line-too-long` comments
"src/kohlrahbi/conditions/allgemeine_festlegungen.py" = ["E501"]
"src/kohlrahbi/docxfilefinder.py" = ["E501"]
"src/kohlrahbi/docxtablecells/bedinungscell.py" = ["E501"]
"src/kohlrahbi/models/flat_ahb_reader.py" = ["E501"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["i", "j", "k", "ex", "Run", "_", "df"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["snapshot: mark a test as a snapshot test"]

[tool.codespell]
skip = 'src/kohlrahbi.egg-info'
ignore-words = 'domain-specific-terms.txt'
